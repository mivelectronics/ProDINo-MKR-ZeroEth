; MIV Electronics / KMP Electronics - ProDINo MKR Zero Ethernet v11 (ATSAMD21G18A)
; The board is pin-for-pin an Arduino MKR GSM 1400 (same SAMD21 pin usage, the GSM
; lines go to the add-on header J14), so the stock Arduino SAMD core + mkrgsm1400
; variant is used as-is. Bootloader: the KMP (Arduino SAM-BA) one, app at 0x2000.

[platformio]
default_envs = prodino_mkr

[env]
platform = atmelsam
framework = arduino
board = mkrgsm1400
monitor_speed = 115200
; No BQ24195 PMIC on this board: with the flag the core's initVariant() drives PB09
; (J14.10 VBATT/BOOT0) and writes PMIC registers over I2C on the Grove bus at boot.
build_unflags = -DUSE_BQ24195L_PMIC
; USB strings (VID/PID stay the Arduino MKR GSM 1400 ones: 2341:8052, no driver needed)
board_build.usb_product = ProDINo MKR Zero Ethernet
board_vendor = KMP Electronics
lib_deps =
    arduino-libraries/Ethernet@^2.0.2
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11

; --- normal use: upload over USB through the bootloader (1200 bps touch + BOSSA) ---
[env:prodino_mkr]
upload_protocol = sam-ba

; --- alternative: SWD with J-Link on J11 (2x3 header); keeps the bootloader at 0x0000 ---
[env:prodino_mkr_jlink]
upload_protocol = jlink
debug_tool = jlink
